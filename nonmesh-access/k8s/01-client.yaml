apiVersion: v1
kind: ServiceAccount
metadata:
  name: mesh-client
  namespace: nonmesh-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-client
  namespace: nonmesh-lab
  labels:
    app: mesh-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mesh-client
  template:
    metadata:
      labels:
        app: mesh-client
    spec:
      serviceAccountName: mesh-client
      containers:
        - name: curl
          image: curlimages/curl:8.11.1
          command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Service
metadata:
  name: mesh-client
  namespace: nonmesh-lab
  labels:
    app: mesh-client
spec:
  selector:
    app: mesh-client
  ports:
    - name: http
      port: 8080
      targetPort: 8080
