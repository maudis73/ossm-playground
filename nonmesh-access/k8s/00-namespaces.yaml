apiVersion: v1
kind: Namespace
metadata:
  name: nonmesh-lab
  labels:
    istio-discovery: enabled
    istio.io/rev: default
    openshift.io/cluster-monitoring: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: nonmesh-plain
  labels:
    openshift.io/cluster-monitoring: "true"
    # Discover Services for Sidecar egress / REGISTRY_ONLY, but do NOT inject
    # (no istio.io/rev) — pods stay plain 1/1.
    istio-discovery: enabled
