apiVersion: v1
kind: Pod
metadata:
  name: probe-pod
  namespace: admission-test
  labels:
    app: probe
spec:
  restartPolicy: Never
  containers:
    - name: pause
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 64Mi
