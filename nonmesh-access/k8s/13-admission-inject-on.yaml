# Phase G — enable injection on the webhook namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: admission-lab
  labels:
    openshift.io/cluster-monitoring: "true"
    istio-discovery: enabled
    istio.io/rev: default
---
# STRICT makes API server → sidecar fail (API server is not an Istio mTLS client).
# With PERMISSIVE alone, inbound HTTPS to the webhook often still succeeds.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: admission-webhook-strict
  namespace: admission-lab
spec:
  selector:
    matchLabels:
      app: admission-webhook
  mtls:
    mode: STRICT
