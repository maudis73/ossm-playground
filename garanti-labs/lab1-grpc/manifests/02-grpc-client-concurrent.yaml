# Concurrent client for Step 6 — 10 parallel streams, 30 qps (stress http2MaxRequests)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-client
  namespace: ossm-playground-apps
  labels:
    app: grpc-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grpc-client
  template:
    metadata:
      labels:
        app: grpc-client
    spec:
      containers:
        - name: fortio
          image: docker.io/fortio/fortio:latest
          command:
            - /usr/bin/fortio
            - load
            - -grpc
            - -t
            - "0"
            - -c
            - "10"
            - -qps
            - "30"
            - -loglevel
            - verbose
            - grpc-echo.ossm-playground-apps.svc.cluster.local:8079
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
