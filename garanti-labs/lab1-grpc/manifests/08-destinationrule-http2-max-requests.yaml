# http2MaxRequests 2 — caps concurrent active streams to backend (visible with concurrent client)
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: grpc-echo
  namespace: ossm-playground-apps
spec:
  host: grpc-echo.ossm-playground-apps.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      http:
        h2UpgradePolicy: UPGRADE
        maxRequestsPerConnection: 0
        http2MaxRequests: 2
