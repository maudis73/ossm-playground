# maxRequestsPerConnection: 1 — new Envoy→pod TCP after each RPC (higher churn; LB already per-RPC at baseline)
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: grpc-echo
  namespace: ossm-playground-apps
spec:
  host: grpc-echo.ossm-playground-apps.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      http:
        h2UpgradePolicy: UPGRADE
        maxRequestsPerConnection: 1
