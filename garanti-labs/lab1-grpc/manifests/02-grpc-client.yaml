# Meshed gRPC client — 5 qps through sidecar to Service (not direct to pod IPs)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-client
  namespace: ossm-playground-apps
  labels:
    app: grpc-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grpc-client
  template:
    metadata:
      labels:
        app: grpc-client
    spec:
      containers:
        # fortio image is distroless — no /bin/sh. Use -t 0 to run until pod delete (not -t 20s — exit triggers CrashLoopBackOff / 1/2 Ready).
        - name: fortio
          image: docker.io/fortio/fortio:latest
          command:
            - /usr/bin/fortio
            - load
            - -grpc
            - -t
            - "0"
            - -c
            - "2"
            - -qps
            - "5"
            - -loglevel
            - verbose
            - grpc-echo.ossm-playground-apps.svc.cluster.local:8079
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
