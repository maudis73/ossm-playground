# Tight egress — only in-namespace + istiod; blocks httpbin until allow list updated
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: productpage-egress-lab
  namespace: ossm-playground-apps
spec:
  workloadSelector:
    labels:
      app: productpage
  egress:
    - hosts:
        - "./*"
        - "istio-system/*"
